# Witness: web page (Caddy) + gateway. Optional Mosquitto broker for a self-contained lab.
# Run from this folder:  docker compose up -d
# The page is then at http://<host>:8088
services:
  witness:
    image: caddy:2-alpine
    container_name: witness-web
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ../site:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  lookout-gateway:                 # host name is used by Caddy and by handoff URLs; keep it
    build: ../gateway
    image: lookout-gateway:2.1.1
    container_name: lookout-gateway
    restart: unless-stopped
    env_file:
      - gateway.env                # optional first-start seed (OPCUA_SERVERS / MQTT_BROKERS)
      - agent.env                  # ANTHROPIC_API_KEY for Move to Timebase
    volumes:
      - ./briefs:/data/briefs              # saved handoffs
      - ./lookout-data:/data/lookout       # connections.json (secrets encrypted) + OPC UA client certificate
      - ./lookout-secret:/run/lookout:ro   # master.key that encrypts stored secrets
    networks: [default, timebase]

  # Optional: a local broker to point Witness at.
  # mosquitto:
  #   image: eclipse-mosquitto:2.1.4
  #   restart: unless-stopped
  #   ports: ["1883:1883", "9001:9001"]

networks:
  default: {}
  timebase:                        # the Timebase stack's network, so Collector/Atlas can fetch handoffs
    name: timebase-2-0-beta_default
    external: true
