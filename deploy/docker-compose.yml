# Timebase Witness: its own compose project (web page + gateway).
# Run from this folder:  docker compose up -d --build     Page: http://<host>:8088
# Data, key and env files live next to this file and are git-ignored.
name: witness

services:
  web:
    image: caddy:2-alpine
    container_name: witness-web
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ../site:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [gateway]

  gateway:
    build: ../gateway
    image: witness-gateway:current
    container_name: witness-gateway
    restart: unless-stopped
    env_file:
      - path: gateway.env          # optional first-start seed (OPCUA_SERVERS / MQTT_BROKERS)
        required: false
      - path: agent.env            # ANTHROPIC_API_KEY for Handoffs
        required: false
    volumes:
      - ./briefs:/data/briefs              # saved handoffs
      - ./lookout-data:/data/lookout       # connections.json (secrets encrypted) + OPC UA client certificate
      - ./lookout-secret:/run/lookout:ro   # master.key that encrypts stored secrets
    networks:
      default:
        aliases: [lookout-gateway]
      timebase:
        # Gage in Collector/Atlas fetches handoffs from http://lookout-gateway:8090 - keep this alias.
        aliases: [lookout-gateway]

networks:
  default: {}
  timebase:                        # the Timebase stack's network; change the name to match yours
    name: timebase-2-0-beta_default
    external: true
